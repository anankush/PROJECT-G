name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - main # When code is pushed to the main branch, this workflow will trigger

jobs:
  ftp-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject Production Database Credentials
        # Replaces dummy variables in private/db.php with secure secrets on the runner.
        # This prevents credentials from being exposed in the repository,
        # while ensuring the deployed app has the correct production access.
        run: |
          sed -i "s/\$db_host = 'localhost';/\$db_host = '${{ secrets.DB_HOST }}';/" private/db.php
          sed -i "s/\$db_name = 'roshan_ka_tech';/\$db_name = '${{ secrets.DB_NAME }}';/" private/db.php
          sed -i "s/\$db_user = 'root';/\$db_user = '${{ secrets.DB_USER }}';/" private/db.php
          sed -i "s/\$db_pass = '';/\$db_pass = '${{ secrets.DB_PASSWORD }}';/" private/db.php

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /roshankatech1.freedev.app/htdocs/ # Deployment path for the specific subdomain
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md