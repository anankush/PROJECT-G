name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - main # When code is pushed to the main branch, this workflow will trigger

jobs:
  ftp-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject Production Database Credentials
        # Safely creates a secrets.php file on the runner. 
        # private/db.php will automatically load this file for credentials.
        run: |
          cat << 'EOF' > private/secrets.php
          <?php
          $db_host = '${{ secrets.DB_HOST }}';
          $db_name = '${{ secrets.DB_NAME }}';
          $db_user = '${{ secrets.DB_USER }}';
          $db_pass = '${{ secrets.DB_PASSWORD }}';
          $google_script_url = '${{ secrets.GOOGLE_SCRIPT_URL }}';
          ?>
          EOF

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /roshankatech.unaux.com/ # Deployment path for ProFreeHost subdomain
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md