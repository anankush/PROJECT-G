name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - main # When code is pushed to the main branch, this workflow will trigger

jobs:
  ftp-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject Production Database Credentials
        # Completely rewrites private/db.php on the runner with the secure secrets.
        # This is much safer than 'sed' because it won't break if your password has special characters like '/' or '&'.
        run: |
          cat << 'EOF' > private/db.php
          <?php
          /**
           * Database connection for Roshan Ka Tech
           * Centralized DB connection to be used by public and admin panels.
           */
          
          $db_host = '${{ secrets.DB_HOST }}';
          $db_name = '${{ secrets.DB_NAME }}';
          $db_user = '${{ secrets.DB_USER }}';
          $db_pass = '${{ secrets.DB_PASSWORD }}';
          
          try {
              $pdo = new PDO("mysql:host=$db_host;dbname=$db_name;charset=utf8mb4", $db_user, $db_pass);
              $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $pdo->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE, PDO::FETCH_ASSOC);
          } catch (PDOException $e) {
              $pdo = null;
          }
          ?>
          EOF

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /roshankatech1.freedev.app/htdocs/ # Deployment path for the specific subdomain
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md